[package]
name = "syncfs"
version = "0.1.0"
edition = "2021"
description = "A replicating FUSE filesystem: every node keeps a full local copy, writes need quorum and a whole-file lock"
license = "MIT OR Apache-2.0"
repository = "https://github.com/oliverclaude/syncfs"
readme = "README.md"
keywords = ["fuse", "filesystem", "replication", "quorum"]
categories = ["filesystem"]

[[bin]]
name = "syncfs"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
fuser = "0.18"
humantime = "2.4.0"
libc = "0.2.191"
log = "0.4.35"
postcard = { version = "1.1.3", features = ["use-std"] }
redb = "4.6.0"
rustix = { version = "1.1.6", features = ["fs", "pipe", "process", "rand", "stdio", "system"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
serde_yaml_ng = "0.10.0"
signal-hook = "0.4.6"
thiserror = "2.0.21"

[profile.release]
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
proptest = "1.12.0"
proptest-derive = "0.9.0"
tempfile = "3.27.0"
