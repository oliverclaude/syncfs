[package]
name = "syncfs"
version = "0.1.0"
edition = "2021"
description = "A replicating FUSE filesystem: every node keeps a full local copy, writes need quorum and a whole-file lock"
license = "MIT OR Apache-2.0"
repository = "https://github.com/oliverclaude/syncfs"
readme = "README.md"
keywords = ["fuse", "filesystem", "replication", "quorum"]
categories = ["filesystem"]

[[bin]]
name = "syncfs"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
humantime = "2.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml_ng = "0.10.0"
thiserror = "2.0.21"

[profile.release]
lto = true
codegen-units = 1
strip = true
