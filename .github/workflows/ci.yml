name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
      - name: Install FUSE
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse3
          echo user_allow_other | sudo tee -a /etc/fuse.conf
          ls -l /dev/fuse
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test -- --nocapture 2>&1 | tee test.log; test ${PIPESTATUS[0]} -eq 0
      - name: Lock protocol model check (optimized; skipped in the debug run)
        run: cargo test --release --lib lock::model -- --nocapture
      - name: Check that FUSE tests ran
        run: "! grep -E 'SKIPPED: (/dev/fuse|fusermount3)' test.log"
      - name: FUSE tests as root
        run: |
          for t in mount status cluster; do
            bin=$(cargo test --test $t --no-run --message-format=json 2>/dev/null \
              | jq -r 'select(.executable != null) | .executable' | grep "/$t-")
            sudo env PATH="$PATH" "$bin" --nocapture
          done
